# ==============================================================================
# ARCHIVO DE PARAMETRIZACIÓN MAESTRA - ÓPTICA ECO KIOSCO
# ==============================================================================

# --- RED Y CONECTIVIDAD ---
ESSID="casa5"
KEY="12345678901234567890666666"
# IP fija o "DHCP" para red dinámica
IP="192.168.1.244"
NMASK="255.255.255.0"
GW="192.168.1.1"
DNS1="8.8.8.8"
DNS2="8.8.4.4"

# --- PANTALLA Y KIOSCO ---
# ORIENTACION="90" indica monitor físico girado 90° a la derecha (horario).
ORIENTACION="90"
URL="https://opticaeco.com/probador/index.php"

# --- PARÁMETROS DE CÁMARA (ARDUCAM IMX179) ---
# CAM_WIDTH y CAM_HEIGHT: Resolución de captura del sensor USB.
# Opciones recomendadas: 1280 (HD) o 1920 (Full HD).
CAM_WIDTH="1920"
CAM_HEIGHT="1080"

# CROP_FACTOR: Control de Zoom y Recorte de entorno (Valor continuo decimal).
# - 1.0  = Imagen completa sin recorte (se ve todo el entorno).
# - 0.6  = Recorte óptimo (conserva el 60% central: rostro y busto, elimina fondo).
# - 0.3  = Zoom extremo (primer plano cerrado al rostro).
CROP_FACTOR="0.60"

# ESPEJO: Comportamiento de la imagen respecto al movimiento del usuario.
# - 1 = Efecto espejo activo (movimiento natural: te mueves a la izq/der y la imagen acompaña).
# - 0 = Imagen real sin invertir (modo cámara normal).
ESPEJO="1"

# CALIDAD_JPEG: Compresión de la imagen guardada para enviar a la nube (Valor entero).
# - Rango: 1 a 100 (90-95 es el balance perfecto entre nitidez y velocidad de subida).
CALIDAD_JPEG="95"
